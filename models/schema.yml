version: 2
sources:
   - name: gz_raw_data
     database: boreal-analog-479210-j6
     schema: gz_raw_data
     loader: bigquery
     description: Raw data from Greenweez
     freshness:
       warn_after: {count: 12, period: hour}
       error_after: {count: 24, period: hour}
     tables:
       - name: raw_gz_product
         identifier: raw_gz_product
         description: product of Greenweez 
         columns:
           - name: purchase_price
             description: purchase price   
           - name: products_id
             description: the id of the purchased product  
             tests:
             - not_null
             - unique
             

       - name: raw_gz_sales
         identifier: raw_gz_sales
         description: sales of Greenweez / we have on row per product_id found in each orders_id
         columns:
           - name: date_date
             description: date of purchase
           - name: orders_id
             description: orders id of the purchase
           - name: pdt_id
             description: products id
           - name: revenue
             description: revenue of sales
           - name: quantity
             description: quantity of sales
         tests:
          - unique:
              column_name: "( orders_id || '-' || pdt_id )"

       - name: raw_gz_ship
         identifier: raw_gz_ship
         description: shipping cost of Greenweez / we have on row per orders_id found in each shipping_fee
         columns:
           - name: orders_id
             description: orders_id
             tests:
             - not_null
             - unique
           - name: shipping cost
             description: shipping cost per orders_id
           - name: shipping_fee
             description: shipping fee
           - name: log_cost
             description: logistic cost


       - name: adwords
         identifier: raw_gz_adwords
         description: cost, impressions and click by campaign per day
         columns:
          - name: date_date
            description: date where the Ads was run
          - name: paid_source
            description: Where the Ads was placed, in this case all are Adwords
          - name: campaign_key
            description: primary key
          - name: camPGN_name
            description: Campaign name
          - name: ads_cost
            description: Cost of the Ads
          - name: impression
            description: nb of impressions
          - name: click
            description: nb of clicks
         tests:
          - unique:
              column_name: "( date_date || '-' || campaign_key )"

       - name: bing
         identifier: raw_gz_bing
         description: Ads Bing Ads cost, impressions and daily clicks.
         columns:
          - name: date_date
            description: date where the Ads was run
          - name: paid_source
            description: Where the Ads was placed, in this case all are Adwords
          - name: campaign_key
            description: primary key
          - name: camPGN_name
            description: Campaign name
          - name: ads_cost
            description: Cost of the Ads
          - name: impression
            description: nb of impressions
          - name: click
            description: nb of clicks
         tests:
          - unique:
              column_name: "( date_date || '-' || campaign_key )"

       - name: criteo
         identifier: raw_gz_criteo
         description: Ads Criteo cost, impressions, clicks.
         columns:
          - name: date_date
            description: date where the Ads was run
          - name: paid_source
            description: Where the Ads was placed, in this case all are Adwords
          - name: campaign_key
            description: primary key
          - name: camPGN_name
            description: Campaign name
          - name: ads_cost
            description: Cost of the Ads
          - name: impression
            description: nb of impressions
          - name: click
            description: nb of clicks
         tests:
          - unique:
              column_name: "( date_date || '-' || campaign_key )"

       - name: facebook
         identifier: raw_gz_facebook
         description: Ads Facebook Ads cost, impressions, clicks.
         columns:
          - name: date_date
            description: date where the Ads was run
          - name: paid_source
            description: Where the Ads was placed, in this case all are Adwords
          - name: campaign_key
            description: primary key
          - name: camPGN_name
            description: Campaign name
          - name: ads_cost
            description: Cost of the Ads
          - name: impression
            description: nb of impressions
          - name: click
            description: nb of clicks
         tests:
          - unique:
              column_name: "( date_date || '-' || campaign_key )"

models:
  - name: int_campaigns_day
    description: Aggregated daily advertising metrics combining all ad platforms
      (Adwords, Bing, Criteo, Facebook). Output is one row per day and source.
    columns:
      - name: date_date
        description: Date of the advertising activity
        tests:
          - not_null
      - name: paid_source
        description: Advertising source (Adwords, Bing, Criteo, Facebook)
        tests:
          - not_null
      - name: ads_cost
        description: Total advertising cost for the day and source
      - name: impressions
        description: Total number of impressions for the day and source
      - name: clicks
        description: Total number of clicks for the day and source
    tests:
      - unique:
          column_name: "(date_date || '-' || paid_source)"
